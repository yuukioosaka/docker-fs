name: Build and push FreeSWITCH image

on:
  schedule:
    # every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'freeswitch' }}
  UPSTREAM_REPO: signalwire/freeswitch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve latest upstream tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set. Add them as secrets on the 'prod' environment (Settings > Environments > prod > Environment secrets)."
            exit 1
          fi

          # Upstream release tags are plain semver ("v1.11.3"); there are also
          # distro-style tags we do not want, so filter and version-sort.
          latest=$(gh api "repos/${UPSTREAM_REPO}/tags" --paginate \
            --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "::error::could not resolve upstream FreeSWITCH tags"
            exit 1
          fi
          echo "latest upstream tag: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

          # Ask the registry rather than the Docker Hub API: the Hub API needs
          # a token with read scope and rate-limits aggressively, whereas the
          # registry is authoritative for the exact tag we are about to push.
          #
          # We authenticate so a private repo is distinguishable from a missing
          # one. Anonymous requests answer 401 for both, which would make a
          # private repo rebuild every day forever.
          repo="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          token=$(curl -fsS \
            --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" \
            | jq -r .token)

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/${repo}/manifests/${latest}")

          case "$code" in
            200)
              echo "image ${repo}:${latest} already exists on Docker Hub"
              echo "build=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "image ${repo}:${latest} not found, will build"
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected registry response ${code} for ${repo}:${latest}"
              exit 1
              ;;
          esac

          if [ "${FORCE:-false}" = "true" ]; then
            echo "force rebuild requested"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write FS_VERSION
        run: printf '%s\n' "${{ needs.check.outputs.version }}" > FS_VERSION

      - name: Delete existing image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          auth=$(printf '%s' "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" | base64 -w0)

          # Deleting a manifest (or the latest tag) keeps the old tag pointing at
          # a stale image, so remove every tag that will be overwritten.
          for tag in "$VERSION" latest; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Basic ${auth}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/${tag}/")

            case "$code" in
              204)
                echo "deleted ${IMAGE_NAME}:${tag}"
                ;;
              404)
                echo "tag ${IMAGE_NAME}:${tag} does not exist, nothing to delete"
                ;;
              *)
                echo "::error::failed to delete tag ${IMAGE_NAME}:${tag} (HTTP ${code})"
                exit 1
                ;;
            esac
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
