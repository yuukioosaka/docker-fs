name: Build and push FreeSWITCH image

on:
  schedule:
    # every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the version has not changed"
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'freeswitch' }}
  UPSTREAM_REPO: signalwire/freeswitch

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current state (upstream tag + last built tag)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Upstream tags are plain semver ("v1.10.12"), created by signalwire's
          # release process. `sort -V` gives us the highest one.
          latest=$(gh api "repos/${UPSTREAM_REPO}/tags" --paginate \
            --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "::error::could not resolve upstream FreeSWITCH tags"
            exit 1
          fi

          # The tag actually baked into the Dockerfile is the source of truth for
          # "what did we last build".
          current=$(sed -n 's/^ARG FS_VERSION=//p' Dockerfile | head -n1)
          echo "upstream=$latest current=$current"

          echo "version=$latest" >> "$GITHUB_OUTPUT"

          if [ "$latest" != "$current" ] || [ "${FORCE:-false}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date at $current, nothing to do."
          fi

      - name: Bump FS_VERSION in Dockerfile
        if: steps.version.outputs.changed == 'true'
        run: |
          sed -i "s|^ARG FS_VERSION=.*|ARG FS_VERSION=${{ steps.version.outputs.version }}|" Dockerfile
          git --no-pager diff -- Dockerfile

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump FreeSWITCH to ${{ steps.version.outputs.version }}"
          git push

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FS_VERSION=${{ needs.check.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
